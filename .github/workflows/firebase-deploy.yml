name: Deploy to Firebase (Hosting)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/775174442635/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@medipro-capillary-scope.iam.gserviceaccount.com

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_FIREBASE_API_KEY: AIzaSyD1Iyk-sROWyeGpkk1cX6kZGxtORKige64
          VITE_FIREBASE_AUTH_DOMAIN: medipro-capillary-scope.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: medipro-capillary-scope
          VITE_FIREBASE_STORAGE_BUCKET: medipro-capillary-scope-tokyo
          VITE_FIREBASE_MESSAGING_SENDER_ID: "775174442635"
          VITE_FIREBASE_APP_ID: 1:775174442635:web:eac4a5010f4a5484414e8e
        run: npm run build

      # 自動デプロイは Hosting のみ。
      # Firestore のインデックス操作は、デプロイ用サービスアカウントに権限がなく
      # 403 で失敗する（2026-11-28 確認）。ルール・インデックスを変えたときは
      # CLAUDE.md の手順で手動デプロイするか、サービスアカウントに
      # 「Cloud Datastore インデックス管理者」を付与してから対象を戻すこと。
      - name: Deploy Hosting
        run: npx firebase-tools deploy --only hosting --project medipro-capillary-scope --non-interactive
